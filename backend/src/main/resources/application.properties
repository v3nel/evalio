spring.application.name=backend

# ConfigCat. La clé SDK vient de l'environnement, jamais du dépôt.
# Vide ou absente : mode local (défauts ci-dessous, aucun appel réseau).
configcat.sdk-key=${CONFIGCAT_SDK_KEY:}
configcat.poll-interval-seconds=60

# Défauts locaux, écrasés par le dashboard ConfigCat quand la clé est définie.
# beta-promotion-comparison est un flag d'UI (GET /api/me/features).
# grades-export concerne des données personnelles : serveur uniquement.
evalio.feature-flags.defaults[beta-promotion-comparison]=false
evalio.feature-flags.defaults[grades-export]=false
